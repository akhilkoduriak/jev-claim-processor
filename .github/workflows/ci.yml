name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      # CI=true makes the build fail on any lint warning
      - run: npm run build
        env:
          CI: true

  docker:
    name: Docker image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: claim-processor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (fallback rules, no API key)
        run: |
          docker run -d --name app -p 5000:5000 -e USE_MOCK_JEV=true claim-processor:ci
          for i in $(seq 1 30); do curl -fs http://localhost:5000/health && break; sleep 1; done
          curl -fs http://localhost:5000/ | grep -q 'id="root"'
          curl -fs http://localhost:5000/api/claims/process \
            -H 'Content-Type: application/json' \
            -d '{"claimId":"CI-1","amount":250,"diagnosis":"Annual Checkup"}' | grep -q '"decision":"approve"'
          curl -fs http://localhost:5000/api/claims/process \
            -H 'Content-Type: application/json' \
            -d '{"claimId":"CI-2","amount":5000,"diagnosis":"Cosmetic procedure"}' | grep -q '"decision":"deny"'
          echo "Smoke test passed"

      - name: Container logs
        if: always()
        run: docker logs app || true

      # Continuous delivery: publish the image to GitHub Container Registry on every push to main
      - name: Image tags
        id: meta
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
